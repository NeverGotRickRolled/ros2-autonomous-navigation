name: Robot configuration checks

on:
  push:
    branches: [main]
    paths:
      - "smart_diffbot_description/**"
      - "smart_diffbot_bringup/launch/**"
      - "smart_diffbot_navigation/config/**"
      - "smart_diffbot_safety/**"
      - ".github/workflows/robot-config-checks.yml"
  pull_request:
    paths:
      - "smart_diffbot_description/**"
      - "smart_diffbot_bringup/launch/**"
      - "smart_diffbot_navigation/config/**"
      - "smart_diffbot_safety/**"
      - ".github/workflows/robot-config-checks.yml"

jobs:
  static-and-unit-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight test dependencies
        run: python -m pip install --upgrade pytest PyYAML

      - name: Run ROS-independent scan analysis tests
        env:
          PYTHONPATH: smart_diffbot_safety
        run: python -m pytest -q smart_diffbot_safety/test

      - name: Parse launch Python, Xacro XML and Nav2 YAML
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          import xml.etree.ElementTree as ET
          import yaml

          launch_paths = [
              Path("smart_diffbot_bringup/launch/simulation.launch.py"),
              Path("smart_diffbot_bringup/launch/main.launch.py"),
              Path("smart_diffbot_bringup/launch/examples/single_robot_sim_example.launch.py"),
              Path("smart_diffbot_bringup/launch/examples/multi_robot_sim_example.launch.py"),
          ]
          launch_texts = {}
          for path in launch_paths:
              source = path.read_text(encoding="utf-8")
              ast.parse(source, filename=str(path))
              launch_texts[path.name] = source
              print(f"Python syntax OK: {path}")

          simulation = launch_texts["simulation.launch.py"]
          assert simulation.count("executable='scan_safety_monitor'") == 2
          assert simulation.count("' lidar:=', LaunchConfiguration('lidar')") == 2
          assert "'lidar', LaunchConfiguration('lidar')" in launch_texts["main.launch.py"]
          assert "'lidar', LaunchConfiguration('lidar')" in launch_texts["single_robot_sim_example.launch.py"]
          assert launch_texts["multi_robot_sim_example.launch.py"].count(
              "'lidar', LaunchConfiguration('lidar')"
          ) == 2
          print("LiDAR launch argument and single/multi-robot monitor wiring OK")

          xacro_files = [
              Path("smart_diffbot_description/model/urdf/model.urdf.xacro"),
              Path("smart_diffbot_description/model/urdf/robot.urdf.xacro"),
              Path("smart_diffbot_description/model/urdf/sim_hardware_interface.urdf.xacro"),
          ]
          roots = {}
          for path in xacro_files:
              roots[path.name] = ET.parse(path).getroot()
              print(f"XML OK: {path}")
          assert any(node.attrib.get("type") == "gpu_lidar"
                     for node in roots["sim_hardware_interface.urdf.xacro"].iter("sensor"))
          assert any(node.attrib.get("name") == "lidar_link"
                     for node in roots["model.urdf.xacro"].iter("link"))
          print("GPU LiDAR sensor and robot frame are present in Xacro")

          nav_path = Path("smart_diffbot_navigation/config/navigation_params.yaml")
          nav = yaml.safe_load(nav_path.read_text(encoding="utf-8"))
          for scope, costmap_name in (
              ("/**/local_costmap", "local_costmap"),
              ("/**/global_costmap", "global_costmap"),
          ):
              params = nav[scope][costmap_name]["ros__parameters"]
              assert "obstacle_layer" in params["plugins"], scope
              obstacle = params["obstacle_layer"]
              assert obstacle["plugin"] == "nav2_costmap_2d::ObstacleLayer"
              assert obstacle["scan"]["data_type"] == "LaserScan"
              assert obstacle["scan"]["marking"] is True
              assert obstacle["scan"]["clearing"] is True
          print("Nav2 local/global LaserScan obstacle layers OK")
          PY
